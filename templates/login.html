{% extends "base.html" %}
<!--
  PANTALLA DE INICIO DE SESION (RF01).
  Usa la clase .acceso, un contenedor estrecho y centrado pensado
  para las pantallas de autenticacion.
-->

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
  <div class="acceso">
    <h1 class="titulo-acceso">Rastreador de Gastos</h1>
    <!-- Mensaje devuelto por el servidor cuando los datos no son validos -->
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="tarjeta">
      <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="campo">
          <label for="correo">Correo</label>
          <input id="correo" name="correo" type="email" required>
        </div>
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input id="contrasena" name="contrasena" type="password" required>
        </div>
        <button type="submit">Entrar</button>
      </form>
      <p class="enlace">
        ¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a>
      </p>
    </div>
  </div>
{% endblock %}
