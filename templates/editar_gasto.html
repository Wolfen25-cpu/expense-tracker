<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Editar gasto</title></head>
<body>
  <h1>Editar gasto</h1>
  <form method="POST">
    <p>Fecha: <input name="fecha" type="date" value="{{ gasto.fecha.isoformat() }}" required></p>
    <p>Monto: <input name="monto" type="number" step="0.01" min="0" value="{{ gasto.monto }}" required></p>
    <p>Categoría:
      <select name="categoria_id" required>
        {% for c in categorias %}
          <option value="{{ c.id }}" {% if c.id == gasto.categoria_id %}selected{% endif %}>{{ c.nombre }}</option>
        {% endfor %}
      </select>
    </p>
    <p>Descripción: <input name="descripcion" maxlength="200" value="{{ gasto.descripcion or '' }}"></p>
    <p>Método de pago:
      <select name="metodo_pago">
        {% for m in ["Efectivo", "Tarjeta de débito", "Tarjeta de crédito", "Transferencia", "Otro"] %}
          <option {% if m == gasto.metodo_pago %}selected{% endif %}>{{ m }}</option>
        {% endfor %}
      </select>
    </p>
    <button type="submit">Guardar cambios</button>
    <a href="/gastos">Cancelar</a>
  </form>
</body>
</html>
