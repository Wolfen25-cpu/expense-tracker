{% extends "base.html" %}
<!--
  FORMULARIO DE EDICION de un gasto existente (RF03).
  Cada campo llega precargado con el valor actual del registro.
-->

{% block titulo %}Editar gasto{% endblock %}

{% block contenido %}

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <h1>Editar gasto</h1>
  <div class="tarjeta">
    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="campos">
        <div class="campo">
          <label for="fecha">Fecha</label>
          <input id="fecha" name="fecha" type="date"
                 value="{{ gasto.fecha.isoformat() }}" required>
        </div>
        <div class="campo">
          <label for="monto">Monto</label>
          <input id="monto" name="monto" type="number" step="0.01" min="0"
                 value="{{ gasto.monto }}" required>
        </div>
        <!-- selected deja marcada la categoria que el gasto ya tenia -->
        <div class="campo">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria_id" required>
            {% for c in categorias %}
              <option value="{{ c.id }}"
                {% if c.id == gasto.categoria_id %}selected{% endif %}>{{ c.nombre }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="campo">
          <label for="metodo">Método de pago</label>
          <select id="metodo" name="metodo_pago">
            {% for m in metodos %}
              <option {% if m == gasto.metodo_pago %}selected{% endif %}>{{ m }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="campo">
          <label for="descripcion">Descripción</label>
          <input id="descripcion" name="descripcion" maxlength="200"
                 value="{{ gasto.descripcion or '' }}">
        </div>
      </div>
      <div class="acciones">
        <button type="submit">Guardar cambios</button>
        <a class="boton boton-secundario" href="{{ url_for('gastos') }}">Cancelar</a>
      </div>
    </form>
  </div>

{% endblock %}
