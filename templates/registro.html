{% extends "base.html" %}
<!--
  PANTALLA DE CREACION DE CUENTA (RF01).
  La contrasena viaja al servidor y alli se almacena hasheada (RNF03);
  esta plantilla nunca la guarda ni la muestra.
-->

{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}
  <div class="acceso">
    <h1 class="titulo-acceso">Crear cuenta</h1>
    <!-- Mensaje devuelto por el servidor cuando los datos no son validos -->
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="tarjeta">
      <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" required>
        </div>
        <div class="campo">
          <label for="correo">Correo</label>
          <input id="correo" name="correo" type="email" required>
        </div>
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input id="contrasena" name="contrasena" type="password" minlength="6" required>
        </div>
        <button type="submit">Registrarme</button>
      </form>
      <p class="enlace">
        ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>
      </p>
    </div>
  </div>
{% endblock %}
