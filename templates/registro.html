<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Crear cuenta</title></head>
<body>
  <h1>Crear cuenta</h1>
  <form method="POST">
    <p><input name="nombre" placeholder="Nombre" required></p>
    <p><input name="correo" type="email" placeholder="Correo" required></p>
    <p><input name="contrasena" type="password" placeholder="Contraseña" required></p>
    <button type="submit">Registrarme</button>
  </form>
  <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
</body>
</html>
